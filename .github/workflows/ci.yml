name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.25.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      # Race detector on every OS (Windows included). The race detector
      # requires CGO; GitHub-hosted windows-latest ships a MinGW gcc, so a
      # unified step keeps coverage symmetric across platforms.
      - name: Test (race)
        env:
          CGO_ENABLED: '1'
        run: go test -race -short ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pin an exact version for reproducible verdicts (was "latest").
          version: v1.64.8
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

  bench:
    name: Benchmark (informational)
    runs-on: ubuntu-latest
    # Non-blocking benchmark snapshot. A real >5% regression gate needs a
    # versioned baseline (tracked in docs/audits/); this job uploads an artifact
    # for manual comparison until that baseline lands.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Fibonacci benchmarks
        run: |
          go test -bench='BenchmarkFibonacci/(FastDoubling|MatrixExp|FFTBased)' \
            -benchmem -run='^$' -count=1 -benchtime=1s ./internal/fibonacci/ \
            | tee bench-snapshot.txt

      - name: Upload benchmark snapshot
        uses: actions/upload-artifact@v4
        with:
          name: bench-snapshot
          path: bench-snapshot.txt
          retention-days: 30
