name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.25.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      # Race detector on every OS (Windows included). The race detector
      # requires CGO; GitHub-hosted windows-latest ships a MinGW gcc, so a
      # unified step keeps coverage symmetric across platforms.
      - name: Test (race)
        env:
          CGO_ENABLED: '1'
        run: go test -race -short ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pin an exact version for reproducible verdicts (was "latest").
          version: v1.64.8
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Audit-PRD E10-R5 / P1-09: ensure the codebase still builds on
    # ARM64 targets so a future port to Apple Silicon or AWS Graviton
    # is not blocked by latent amd64-only code. CGO is disabled here —
    # the pure-Go path is what runs on these architectures.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/arm64
            goos: linux
            goarch: arm64
          - target: darwin/arm64
            goos: darwin
            goarch: arm64
          - target: darwin/amd64
            goos: darwin
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile ${{ matrix.target }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./...

  bench:
    name: Benchmark regression gate (>=5%)
    runs-on: ubuntu-latest
    # Blocking gate per Audit-PRD E4. Compares the current branch's
    # BenchmarkFibonacci numbers to docs/audits/bench-baseline.txt via
    # benchstat. A regression >= 5% on any of the gated sub-benchmarks
    # fails the job. Refresh the baseline with `make bench-baseline`.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run Fibonacci benchmarks
        run: |
          go test -bench='BenchmarkFibonacci/(FastDoubling|MatrixExp|FFTBased)' \
            -benchmem -run='^$' -count=5 -benchtime=1x ./internal/fibonacci/ \
            > bench-current.txt
          cat bench-current.txt

      - name: Compare to baseline (>=5% gate)
        run: |
          if [ ! -s docs/audits/bench-baseline.txt ]; then
            echo "::warning::docs/audits/bench-baseline.txt missing or empty; skipping gate."
            exit 0
          fi
          benchstat -row /name docs/audits/bench-baseline.txt bench-current.txt | tee bench-diff.txt
          # benchstat's geomean column line carries the relative shift.
          # We parse percentages of the form "+X.Y%" or "-X.Y%" and fail
          # if any ns/op regression exceeds 5%.
          python3 .github/scripts/bench_gate.py bench-diff.txt 5.0

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-output
          path: |
            bench-current.txt
            bench-diff.txt
          retention-days: 30
