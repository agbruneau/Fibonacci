# Multi-platform smoke tests for packages with assembly backends (e.g. internal/bigfft).
# Full test suite remains local / optional job expansion; see docs/INNOVEPLAN.md P2-c.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  bigfft-matrix:
    name: bigfft (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test internal/bigfft
        run: go test -count=1 -timeout=10m ./internal/bigfft/...
